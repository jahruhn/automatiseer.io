<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Hero image showing automation workflows">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f5ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="12" fill="url(#g1)" />

  <!-- Stylized nodes and connections -->
  <g stroke="#2f9adf" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M160 380 C 260 300, 440 300, 540 220" opacity="0.9" />
    <path d="M540 220 C 640 140, 820 140, 920 80" opacity="0.8" />
    <path d="M260 180 C 360 240, 520 240, 620 300" opacity="0.7" />
  </g>

  <!-- Nodes -->
  <g fill="#2f9adf" stroke="#1b6fa3" stroke-width="2">
    <circle cx="160" cy="380" r="28" />
    <circle cx="260" cy="180" r="24" />
    <circle cx="540" cy="220" r="32" />
    <circle cx="620" cy="300" r="28" />
    <circle cx="920" cy="80" r="36" />
  </g>

  <!-- Devices / widgets -->
  <g fill="#ffffff" stroke="#cfeafc" stroke-width="2">
    <rect x="860" y="360" width="220" height="140" rx="10" fill="#ffffff"/>
    <rect x="140" y="80" width="220" height="140" rx="10" fill="#ffffff"/>
    <rect x="420" y="420" width="260" height="120" rx="10" fill="#ffffff"/>
  </g>

  <!-- Headline area -->
  <g>
    <text x="60" y="520" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#2c3e50">Automatiseer workflows — verbind systemen & bespaar tijd</text>
  </g>
</svg>