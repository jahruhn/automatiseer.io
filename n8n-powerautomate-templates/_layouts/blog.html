---
layout: default
---
<article class="blog-post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}</p>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <footer class="post-footer">
    <p>Meer artikelen op <a href="{{ site.baseurl }}/blog">de blog</a>.</p>
  </footer>
</article>
