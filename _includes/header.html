<style>
  /* Basic dropdown and mobile menu styles */
  .dropdown-menu {
    display: none;
    position: absolute;
    background: white;
    padding: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    list-style: none;
  }
  .dropdown:hover .dropdown-menu {
    display: block;
  }
  .menu-toggle {
    display: none;
    cursor: pointer;
  }
  @media (max-width: 768px) {
    .nav-links {
      display: none;
    }
    .menu-toggle {
      display: block;
    }
  }
</style>

<script>
  // Toggle mobile menu
  document.querySelector('.menu-toggle').addEventListener('click', function() {
    const navLinks = document.querySelector('.nav-links');
    navLinks.style.display = navLinks.style.display === 'block' ? 'none' : 'block';
  });
</script>
