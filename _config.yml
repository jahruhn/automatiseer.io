# Site settings
title: "Automatiseer Je Sales | n8n & Power Automate Templates"
description: "Kant-en-klare workflows voor sales, marketing en business processen. Bespaar tijd met n8n en Power Automate. Gemaakt door Jeroen Tuijn."
url: "https://a-ads.com"
baseurl: ""
author: "Jeroen Tuijn"
email: "your-email@example.com"
github_username: "jahruhn"
twitter_username: "JeroenTuijn"
linkedin_username: "jeroentuijn"

# GitHub Pages settings
theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/