---
layout: default
---
<article class="blog-post">
  <header>
    {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-hero-image"
      style="width:100%; height:auto; border-radius:12px; margin-bottom:20px;">
    {% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}</p>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <footer class="post-footer">
    <p>Meer artikelen op <a href="{{ site.baseurl }}/blog">de blog</a>.</p>
  </footer>
</article>
